name: Build remake.exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release x64)
        run: msbuild remake.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item bin\x64\Release\remake.exe dist\
          Copy-Item bin\x64\Release\Assets dist\Assets -Recurse

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: remake-x64
          path: dist
          if-no-files-found: error
